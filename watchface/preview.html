<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Classic Dial Preview</title>
<link rel="icon" href="../favicon.svg">
<style>
  :root { --bg: #f1f1f4; --ink: #1c1c22; --muted: #6b6b76; --card: #ffffff; --line: #dcdce2; --accent: #3a6fe0; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121216; --ink: #ececf1; --muted: #9a9aa6; --card: #1c1c22; --line: #2e2e36; --accent: #7aa2ff; }
  }
  :root[data-theme="dark"] { --bg: #121216; --ink: #ececf1; --muted: #9a9aa6; --card: #1c1c22; --line: #2e2e36; --accent: #7aa2ff; }
  * { box-sizing: border-box; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px 48px; }
  main { max-width: 760px; margin: 0 auto; display: grid; gap: 24px; justify-items: center; }
  h1 { font-size: 22px; font-weight: 650; }
  p.sub { color: var(--muted); text-align: center; max-width: 52ch; }
  .watch { width: min(420px, 100%); aspect-ratio: 1; border-radius: 50%; padding: 14px; background: linear-gradient(145deg, #3b3b40, #16161a); box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  .watch svg { width: 100%; height: 100%; display: block; border-radius: 50%; background: #000; }
  .controls { width: 100%; max-width: 460px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 14px; }
  select { font: inherit; color: var(--ink); background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; min-width: 0; }
  label { display: grid; grid-template-columns: 110px 1fr 56px; align-items: center; gap: 10px; }
  label span:last-child { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; border: 1px solid var(--line); background: transparent; color: var(--ink); padding: 7px 14px; border-radius: 999px; cursor: pointer; }
  button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .err { color: #d33; white-space: pre-wrap; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Classic Dial</h1>
  <p class="sub">A live render of <code>app/src/main/res/raw/watchface.xml</code> — the same file the watch uses. Drag the sliders to try different values.</p>
  <div class="watch"><svg id="face" viewBox="0 0 450 450" role="img" aria-label="Watch face preview"></svg></div>
  <div class="controls">
    <label><span>Battery</span><input id="battery" type="range" min="0" max="100" value="100"><span id="batteryV"></span></label>
    <label><span>Steps</span><input id="steps" type="range" min="0" max="12000" step="1" value="3457"><span id="stepsV"></span></label>
    <label><span>Step goal</span><input id="goal" type="range" min="1000" max="15000" step="500" value="6000"><span id="goalV"></span></label>
    <label><span>Right ring</span><select id="stepsType">
      <option value="GOAL_PROGRESS">Steps with goal (ring fills)</option>
      <option value="SHORT_TEXT">Steps as text (system default)</option>
    </select><span></span></label>
    <div class="row">
      <button id="ambient" aria-pressed="false">Ambient mode</button>
      <button id="frozen" aria-pressed="false">Show 10:08</button>
    </div>
    <div id="err" class="err"></div>
  </div>
</main>
<script>
const SVGNS = "http://www.w3.org/2000/svg";
const svg = document.getElementById("face");
const $ = id => document.getElementById(id);
let doc = null;
const state = { ambient: false, frozen: new URLSearchParams(location.search).has("still") };

// Sample data for each complication slot, standing in for what the watch's providers send.
function complications() {
  const battery = +$("battery").value, steps = +$("steps").value, goal = +$("goal").value;
  const stepsType = $("stepsType").value;
  const now = state.frozen ? new Date(2026, 8, 28, 10, 8, 30) : new Date();
  return {
    0: { type: "SHORT_TEXT", TEXT: "7:30", MONOCHROMATIC_IMAGE: "sunrise" },
    3: { type: "SHORT_TEXT", TITLE: now.toLocaleDateString("en-US", { weekday: "short" }).toUpperCase(), TEXT: String(now.getDate()) },
    1: { type: "RANGED_VALUE", TEXT: battery + "%", MONOCHROMATIC_IMAGE: "battery",
         RANGED_VALUE_VALUE: battery, RANGED_VALUE_MIN: 0, RANGED_VALUE_MAX: 100 },
    2: { type: stepsType, TEXT: steps.toLocaleString(), MONOCHROMATIC_IMAGE: "shoe",
         GOAL_PROGRESS_VALUE: steps, GOAL_PROGRESS_TARGET_VALUE: goal },
  };
}

function sources() {
  const now = state.frozen ? new Date(2026, 8, 28, 10, 8, 30) : new Date();
  const steps = +$("steps").value, goal = +$("goal").value;
  const days = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
  return {
    HOUR_0_11: now.getHours() % 12, MINUTE: now.getMinutes(), SECOND: now.getSeconds(),
    DAY: now.getDate(), DAY_OF_WEEK_S: days[now.getDay()],
    BATTERY_PERCENT: +$("battery").value,
    STEP_COUNT: steps, STEP_GOAL: goal, STEP_PERCENT: Math.round(steps / goal * 100),
  };
}

function evaluate(expr, src) {
  const js = expr
    .replace(/\[([A-Z0-9_.]+)\]/g, (_, k) => k in src ? JSON.stringify(src[k]) : k.startsWith("COMPLICATION.") ? "null" : "0")
    .replace(/&lt;/g, "<").replace(/&gt;/g, ">")
    .replace(/\bclamp\(/g, "__clamp(");
  // eslint-disable-next-line no-new-func
  return Function("__clamp", `return (${js});`)((v, a, b) => Math.min(Math.max(v, a), b));
}

const num = (el, name, d = 0) => el.hasAttribute(name) ? parseFloat(el.getAttribute(name)) : d;
const kids = el => Array.from(el.children);

function attrsWithOverrides(el, src) {
  const a = {};
  for (const at of el.attributes) a[at.name] = at.value;
  for (const c of kids(el)) {
    if (c.tagName === "Transform") a[c.getAttribute("target")] = evaluate(c.getAttribute("value"), src);
    if (c.tagName === "Variant" && state.ambient && c.getAttribute("mode") === "AMBIENT") a[c.getAttribute("target")] = c.getAttribute("value");
  }
  return a;
}

function mk(tag, attrs, parent) {
  const n = document.createElementNS(SVGNS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  parent.appendChild(n);
  return n;
}

// A positioned container: translate to x,y, then rotate about the pivot.
function container(a, parent) {
  const x = +a.x || 0, y = +a.y || 0, w = +a.width || 0, h = +a.height || 0;
  const px = (a.pivotX !== undefined ? +a.pivotX : 0.5) * w, py = (a.pivotY !== undefined ? +a.pivotY : 0.5) * h;
  const g = mk("g", { transform: `translate(${x} ${y}) rotate(${+a.angle || 0} ${px} ${py})` }, parent);
  const alpha = a.alpha !== undefined ? +a.alpha / 255 : 1;
  if (alpha !== 1) g.setAttribute("opacity", alpha);
  return g;
}

function style(el, node) {
  const fill = kids(el).find(c => c.tagName === "Fill");
  const stroke = kids(el).find(c => c.tagName === "Stroke");
  node.setAttribute("fill", fill ? fill.getAttribute("color") : "none");
  if (stroke) {
    node.setAttribute("stroke", stroke.getAttribute("color"));
    node.setAttribute("stroke-width", stroke.getAttribute("thickness"));
    node.setAttribute("stroke-linecap", (stroke.getAttribute("cap") || "BUTT").toLowerCase());
  }
}

function drawShape(el, g, src) {
  const a = attrsWithOverrides(el, src);
  let n;
  switch (el.tagName) {
    case "Line": n = mk("line", { x1: a.startX, y1: a.startY, x2: a.endX, y2: a.endY }, g); break;
    case "Ellipse": n = mk("ellipse", { cx: +a.x + a.width / 2, cy: +a.y + a.height / 2, rx: a.width / 2, ry: a.height / 2 }, g); break;
    case "RoundRectangle": n = mk("rect", { x: a.x, y: a.y, width: a.width, height: a.height, rx: a.cornerRadiusX, ry: a.cornerRadiusY }, g); break;
    case "Rectangle": n = mk("rect", { x: a.x, y: a.y, width: a.width, height: a.height }, g); break;
    case "Arc": {
      const cx = +a.centerX, cy = +a.centerY, rx = a.width / 2, ry = a.height / 2;
      const s = +a.startAngle, e = +a.endAngle;
      if (Math.abs(e - s) < 0.01) return;
      const pt = d => [cx + rx * Math.sin(d * Math.PI / 180), cy - ry * Math.cos(d * Math.PI / 180)];
      const [x0, y0] = pt(s), [x1, y1] = pt(e);
      n = mk("path", { d: `M${x0} ${y0} A${rx} ${ry} 0 ${Math.abs(e - s) > 180 ? 1 : 0} ${e > s ? 1 : 0} ${x1} ${y1}` }, g);
      break;
    }
    default: return;
  }
  style(el, n);
}

function textContent(node, src) {
  let out = "";
  for (const c of node.childNodes) {
    if (c.nodeType === 3 || c.nodeType === 4) out += c.textContent.trim();
    else if (c.tagName === "Template") {
      const params = kids(c).filter(p => p.tagName === "Parameter").map(p => evaluate(p.getAttribute("expression"), src));
      let i = 0;
      out += Array.from(c.childNodes).filter(t => t.nodeType === 3 || t.nodeType === 4).map(t => t.textContent).join("").trim()
        .replace(/%[sd]/g, m => { const v = params[i++]; return m === "%d" ? Math.round(v) : v; });
    } else if (c.tagName === "Upper") out += textContent(c, src).toUpperCase();
    else if (c.tagName === "Lower") out += textContent(c, src).toLowerCase();
  }
  return out;
}

const WEIGHTS = { THIN: 100, LIGHT: 300, NORMAL: 400, MEDIUM: 500, SEMI_BOLD: 600, BOLD: 700, EXTRA_BOLD: 800, BLACK: 900 };

function render(el, parent, src) {
  const a = attrsWithOverrides(el, src);
  switch (el.tagName) {
    case "Scene":
      mk("rect", { width: 450, height: 450, fill: a.backgroundColor || "#000" }, parent);
      kids(el).forEach(c => render(c, parent, src));
      break;
    case "Group":
      kids(el).forEach(c => render(c, container(a, parent), src));
      break;
    case "ComplicationSlot": {
      const data = complications()[el.getAttribute("slotId")] || { type: "EMPTY" };
      const c = kids(el).find(k => k.tagName === "Complication" && k.getAttribute("type") === data.type);
      if (!c) break;
      const inner = { ...src };
      for (const k in data) if (k !== "type") inner["COMPLICATION." + k] = data[k];
      const g = container(a, parent);
      kids(c).forEach(k => render(k, g, inner));
      break;
    }
    case "Condition": {
      const exprs = {};
      el.querySelectorAll(":scope > Expressions > Expression").forEach(x => exprs[x.getAttribute("name")] = x.textContent);
      const hit = kids(el).find(c => c.tagName === "Compare" && evaluate(exprs[c.getAttribute("expression")], src))
        || kids(el).find(c => c.tagName === "Default");
      if (hit) kids(hit).forEach(c => render(c, parent, src));
      break;
    }
    case "PartDraw": {
      const g = container(a, parent);
      kids(el).forEach(c => drawShape(c, g, src));
      break;
    }
    case "PartText": {
      const g = container(a, parent);
      const text = kids(el).find(c => c.tagName === "Text");
      const font = kids(text).find(c => c.tagName === "Font");
      const align = (text.getAttribute("align") || "CENTER");
      const anchor = align === "START" ? "start" : align === "END" ? "end" : "middle";
      const tx = anchor === "start" ? 0 : anchor === "end" ? +a.width : a.width / 2;
      const t = mk("text", {
        x: tx, y: a.height / 2, "text-anchor": anchor, "dominant-baseline": "central",
        fill: font.getAttribute("color") || "#fff", "font-size": font.getAttribute("size"),
        "font-weight": WEIGHTS[font.getAttribute("weight") || "NORMAL"] || 400,
        "font-family": "'Google Sans', Roboto, system-ui, sans-serif",
      }, g);
      t.textContent = textContent(font, src);
      break;
    }
    case "PartImage": {
      // Stand-ins for the icons a complication provider would send, drawn in the tint colour.
      const g = container(a, parent);
      const w = +a.width, h = +a.height, tint = a.tintColor || "#fff";
      const res = kids(el).find(c => c.tagName === "Image")?.getAttribute("resource") || "";
      const glyph = res.match(/^\[(.+)\]$/) ? src[res.slice(1, -1)] : res;
      if (glyph === "battery") {
        mk("rect", { x: w * .4, y: h * .06, width: w * .2, height: h * .1, rx: 1, fill: tint }, g);
        mk("rect", { x: w * .27, y: h * .14, width: w * .46, height: h * .8, rx: w * .1, fill: tint }, g);
      } else if (glyph === "shoe") {
        mk("path", { d: `M${w * .12} ${h * .25} h${w * .3} l${w * .1} ${h * .25} l${w * .3} ${h * .1} q${w * .15} ${h * .05} ${w * .15} ${h * .2} v${h * .1} h${-w * .85} z`, fill: tint }, g);
      } else if (glyph === "sunrise") {
        mk("path", { d: `M${w * .2} ${h * .72} A${w * .3} ${w * .3} 0 0 1 ${w * .8} ${h * .72} Z`, fill: tint }, g);
        mk("rect", { x: w * .08, y: h * .8, width: w * .84, height: h * .07, rx: h * .035, fill: tint }, g);
      }
      break;
    }
  }
}

function draw() {
  if (!doc) return;
  $("batteryV").textContent = $("battery").value + "%";
  $("stepsV").textContent = (+$("steps").value).toLocaleString();
  $("goalV").textContent = (+$("goal").value).toLocaleString();
  svg.replaceChildren();
  render(doc.querySelector("Scene"), svg, sources());
}

["battery", "steps", "goal", "stepsType"].forEach(id => $(id).addEventListener("input", draw));
$("ambient").addEventListener("click", e => { state.ambient = !state.ambient; e.target.setAttribute("aria-pressed", state.ambient); draw(); });
$("frozen").addEventListener("click", e => { state.frozen = !state.frozen; e.target.setAttribute("aria-pressed", state.frozen); draw(); });
$("frozen").setAttribute("aria-pressed", state.frozen);

fetch("app/src/main/res/raw/watchface.xml")
  .then(r => { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.text(); })
  .then(t => {
    doc = new DOMParser().parseFromString(t, "application/xml");
    if (doc.querySelector("parsererror")) throw new Error(doc.querySelector("parsererror").textContent);
    draw();
    setInterval(() => { if (!state.frozen) draw(); }, 1000);
  })
  .catch(e => { $("err").textContent = "Couldn't load watchface.xml — serve this folder over http (e.g. python3 -m http.server).\n" + e.message; });
</script>
</body>
</html>
