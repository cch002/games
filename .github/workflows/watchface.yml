name: Build watch face

on:
  push:
    paths:
      - "watchface/**"
      - ".github/workflows/watchface.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchface
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Check watchface.xml is up to date with the generator
        run: |
          python3 generate_watchface.py
          git diff --exit-code app/src/main/res/raw/watchface.xml

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: classic-dial-apk
          path: watchface/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
